workflows:
  build-android:
    name: Build Android APK
    max_build_duration: 60
    environment:
      node: latest
      groups:
        - smarthome-env
      vars:
        PACKAGE_NAME: "com.smarthomeiot.skariga"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android release
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - your@email.com
